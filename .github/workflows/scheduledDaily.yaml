name: Daily cron
on:
  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC
  workflow_dispatch:
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Hit daily scheduled endpoint
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.CRON_BASE_URL }}/api/sceduled/daily"
