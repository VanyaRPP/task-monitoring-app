name: Hourly cron
on:
  schedule:
    - cron: '0 * * * *' # top of every hour
  workflow_dispatch:
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Hit hourly scheduled endpoint
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.CRON_BASE_URL }}/api/sceduled/hourly"
