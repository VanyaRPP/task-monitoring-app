name: Sync PR with Asana

on:
  pull_request:
    types: [opened, reopened, closed, labeled]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check Asana token
        id: token
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
        run: |
          if [ -z "$ASANA_TOKEN" ]; then
            echo "ASANA_TOKEN secret is not set — skipping Asana sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Asana task ID from PR title
        id: extract
        if: steps.token.outputs.ready == 'true'
        run: |
          TASK_ID=$(echo "${{ github.event.pull_request.title }}" | grep -oE '[0-9]{8,}' | head -n 1)
          echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"

      - name: Decide target Asana section
        id: section
        if: steps.token.outputs.ready == 'true' && steps.extract.outputs.task_id != ''
        env:
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          LABEL: ${{ github.event.label.name }}
          REVIEW_SECTION_ID: ${{ secrets.ASANA_REVIEW_SECTION_ID }}
          TESTING_SECTION_ID: ${{ secrets.ASANA_TESTING_SECTION_ID }}
          DONE_SECTION_ID: ${{ secrets.ASANA_DONE_SECTION_ID }}
          TODO_SECTION_ID: ${{ secrets.ASANA_TODO_SECTION_ID }}
          IN_PROGRESS_SECTION_ID: ${{ secrets.ASANA_IN_PROGRESS_SECTION_ID }}
        run: |
          SECTION_ID=""
          case "$ACTION" in
            opened|reopened)
              SECTION_ID="$IN_PROGRESS_SECTION_ID"
              ;;
            closed)
              if [ "$MERGED" = "true" ]; then
                SECTION_ID="$DONE_SECTION_ID"
              else
                SECTION_ID="$TODO_SECTION_ID"
              fi
              ;;
            labeled)
              case "$LABEL" in
                "Code review"|"code-review"|"review")
                  SECTION_ID="$REVIEW_SECTION_ID"
                  ;;
                "Testing"|"testing"|"QA")
                  SECTION_ID="$TESTING_SECTION_ID"
                  ;;
              esac
              ;;
          esac
          echo "section_id=${SECTION_ID}" >> "$GITHUB_OUTPUT"

      - name: Move task in Asana
        if: steps.extract.outputs.task_id != '' && steps.section.outputs.section_id != ''
        run: |
          curl --fail --silent --show-error \
            -X POST "https://app.asana.com/api/1.0/sections/${{ steps.section.outputs.section_id }}/addTask" \
            -H "Authorization: Bearer ${{ secrets.ASANA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"task\":\"${{ steps.extract.outputs.task_id }}\"}}"
