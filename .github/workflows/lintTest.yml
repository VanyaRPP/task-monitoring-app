name: CI

on:
  push:
    branches: [dev, deploy]
  pull_request:
    branches: [dev, deploy]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint:check
      - run: yarn types:check
      - run: yarn test
