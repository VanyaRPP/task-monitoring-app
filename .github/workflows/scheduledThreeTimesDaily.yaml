name: Three times daily cron
on:
  schedule:
    - cron: '0 */8 * * *' # 00:00, 08:00, 16:00 UTC
  workflow_dispatch:
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Hit threeTimesDaily scheduled endpoint
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.CRON_BASE_URL }}/api/sceduled/threeTimesDaily"
